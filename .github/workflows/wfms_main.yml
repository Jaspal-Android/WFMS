# Android CI/CD Pipeline
name: Android CI/CD

# Controls when the workflow will run
on:
  push:
    branches:
      - develop
      - beta
      - demo
      - main
      - master

  workflow_dispatch:

# Environment variables
env:
  JAVA_VERSION: '17'
  ANDROID_SDK_TOOLS: '10406996'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError'

# Least privilege: the workflow only reads the repo. Jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  # Job for code quality checks
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: ${{ env.ANDROID_SDK_TOOLS }}
          # v3 defaults to "tools platform-tools"; the legacy "tools" package is no longer
          # published, so sdkmanager exits 1 and the job fails before any Gradle step.
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=/home/runner/Library/Android/sdk" > local.properties

      - name: Enable detailed deprecation warnings
        run: echo -e "\norg.gradle.warning.mode=all" >> gradle.properties

      - name: Run Lint
        run: |
          ./gradlew lintAnalyzeDevDebug
          ./gradlew lintAnalyzeBetaDebug
          ./gradlew lintAnalyzeDemoDebug
          ./gradlew lintAnalyzeProdDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results*.html
          retention-days: 7

  # Job for unit tests
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes the test results as a check run
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=/home/runner/Library/Android/sdk" > local.properties

      - name: Enable detailed deprecation warnings
        run: echo -e "\norg.gradle.warning.mode=all" >> gradle.properties

      - name: Run Unit Tests
        run: |
          ./gradlew testDevDebugUnitTest
          ./gradlew testBetaDebugUnitTest
          ./gradlew testDemoDebugUnitTest
          ./gradlew testProdDebugUnitTest

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/test*UnitTest/
          retention-days: 7

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@d61b558e8df85cb60d09ca3e5b09653b4477cea7 # v1
        with:
          name: Unit Test Results
          path: app/build/test-results/test*UnitTest/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

  # Job for building APKs
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [unit-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: ${{ env.ANDROID_SDK_TOOLS }}
          # v3 defaults to "tools platform-tools"; the legacy "tools" package is no longer
          # published, so sdkmanager exits 1 and the job fails before any Gradle step.
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=/home/runner/Library/Android/sdk" > local.properties

      - name: Enable detailed deprecation warnings
        run: echo -e "\norg.gradle.warning.mode=all" >> gradle.properties

      - name: Set Play upload version code
        if: github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/demo' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      # Build Debug APK for dev branch
      - name: Place google-services.json (dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
        run: |
          mkdir -p app/src/dev
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/dev/google-services.json

      - name: Validate google-services.json (dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          jq empty app/src/dev/google-services.json || (echo "Malformed google-services.json for dev flavor" && exit 1)

      - name: Build Debug APK (dev flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: ./gradlew assembleDevDebug

      - name: Upload Debug APK (dev flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 7

      # Build Debug APK for beta branch
      - name: Place google-services.json (beta debug)
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BETA }}
        run: |
          mkdir -p app/src/beta
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/beta/google-services.json

      - name: Validate google-services.json (beta debug)
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        run: |
          jq empty app/src/beta/google-services.json || (echo "Malformed google-services.json for beta flavor" && exit 1)

      - name: Build Debug APK (beta flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        run: ./gradlew assembleBetaDebug

      - name: Upload Debug APK (beta flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-debug-apk
          path: app/build/outputs/apk/beta/debug/*.apk
          retention-days: 7

      # Build Release APK for beta branch
      - name: Place google-services.json (beta)
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BETA }}
        run: |
          mkdir -p app/src/beta
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/beta/google-services.json

      - name: Decode Keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          echo "$KEYSTORE_FILE" | base64 --decode > keystore.jks

      - name: Build Release APK (beta flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        run: ./gradlew assembleBetaRelease
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: keystore.jks

      - name: Upload Release APK (beta flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-release-apk
          path: app/build/outputs/apk/beta/release/*.apk
          retention-days: 30

      # Build Release App Bundle for beta branch
      - name: Build Release App Bundle (beta flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        run: ./gradlew bundleBetaRelease
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: keystore.jks

      - name: Upload Release App Bundle (beta flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-release-aab
          path: app/build/outputs/bundle/betaRelease/*.aab
          retention-days: 30

      - name: Publish Beta App Bundle to Google Play Internal Testing
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.atvantiq.wfms.beta
          releaseFiles: app/build/outputs/bundle/betaRelease/*.aab
          track: internal
          status: completed
          mappingFile: app/build/outputs/mapping/betaRelease/mapping.txt

      # Build Debug APK for demo branch
      - name: Place google-services.json (demo debug)
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_DEMO }}
        run: |
          mkdir -p app/src/demo
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/demo/google-services.json

      - name: Validate google-services.json (demo debug)
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        run: |
          jq empty app/src/demo/google-services.json || (echo "Malformed google-services.json for demo flavor" && exit 1)

      - name: Build Debug APK (demo flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        run: ./gradlew assembleDemoDebug

      - name: Upload Debug APK (demo flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-debug-apk
          path: app/build/outputs/apk/demo/debug/*.apk
          retention-days: 7

      # Build Release APK for demo branch
      - name: Place google-services.json (demo)
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_DEMO }}
        run: |
          mkdir -p app/src/demo
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/demo/google-services.json

      - name: Validate google-services.json (demo)
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        run: |
          jq empty app/src/demo/google-services.json || (echo "Malformed google-services.json for demo flavor" && exit 1)

      - name: Decode Keystore (demo)
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          echo "$KEYSTORE_FILE" | base64 --decode > keystore.jks

      - name: Build Release APK (demo flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        run: ./gradlew assembleDemoRelease
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: keystore.jks

      - name: Upload Release APK (demo flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-release-apk
          path: app/build/outputs/apk/demo/release/*.apk
          retention-days: 30

      # Build Release App Bundle for demo branch
      - name: Build Release App Bundle (demo flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        run: ./gradlew bundleDemoRelease
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: keystore.jks

      - name: Upload Release App Bundle (demo flavor)
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-release-aab
          path: app/build/outputs/bundle/demoRelease/*.aab
          retention-days: 30

      - name: Publish Demo App Bundle to Google Play Internal Testing
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.atvantiq.wfms.demo
          releaseFiles: app/build/outputs/bundle/demoRelease/*.aab
          track: internal
          status: completed
          mappingFile: app/build/outputs/mapping/demoRelease/mapping.txt

      # Build Release APK for production branch
      - name: Place google-services.json (prod)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
        run: |
          mkdir -p app/src/prod
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/prod/google-services.json

      - name: Validate google-services.json (prod)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          jq empty app/src/prod/google-services.json || (echo "Malformed google-services.json for prod flavor" && exit 1)

      - name: Decode Keystore
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          echo "$KEYSTORE_FILE" | base64 --decode > keystore.jks

      - name: Build Release APK (prod flavor)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: ./gradlew assembleProdRelease
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: keystore.jks

      - name: Upload Release APK (prod flavor)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-release-apk
          path: app/build/outputs/apk/prod/release/*.apk
          retention-days: 30

      # Build Release App Bundle for production branch
      - name: Build Release App Bundle (prod flavor)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: ./gradlew bundleProdRelease
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: keystore.jks

      - name: Upload Release App Bundle (prod flavor)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-release-aab
          path: app/build/outputs/bundle/prodRelease/*.aab
          retention-days: 30

      - name: Upload R8 mapping (prod flavor)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-release-mapping
          path: app/build/outputs/mapping/prodRelease/mapping.txt
          retention-days: 30

      # The signing keystore and Firebase config must not outlive the build.
      - name: Remove signing material
        if: always()
        run: rm -f keystore.jks app/src/*/google-services.json

  # Production release. Runs only for main/master and waits for the approval configured on the
  # "production" GitHub Environment (Settings > Environments > production > Required reviewers).
  publish-prod:
    name: Publish to Google Play (production)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download App Bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prod-release-aab
          path: release

      - name: Download R8 mapping
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prod-release-mapping
          path: release

      - name: Publish Prod App Bundle to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.atvantiq.wfms
          releaseFiles: release/*.aab
          track: production
          status: completed
          mappingFile: release/mapping.txt
